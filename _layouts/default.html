<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.home %}{{ site.name }}{% else %}{{ page.title | escape }} | {{ site.name }}{% endif %}</title>
    <meta name="description" content="{{ site.description | escape }}">
    <meta name="author" content="Zhaoyang Cheng">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ site.name | escape }}">
    <meta property="og:description" content="{{ site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/images/myself.png' | absolute_url }}">
    <meta name="twitter:card" content="summary">
    <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page-shell">
      {% unless page.home %}
      <nav class="back-nav" aria-label="Main navigation"><a href="{{ '/' | relative_url }}">&larr; Home</a></nav>
      {% endunless %}
      <main id="main">{{ content }}</main>
      <footer class="site-footer">
        <span>&copy; {{ site.time | date: '%Y' }} Zhaoyang Cheng</span>
        <a href="https://github.com/{{ site.footer-links.github }}">GitHub</a>
      </footer>
    </div>
  </body>
</html>
